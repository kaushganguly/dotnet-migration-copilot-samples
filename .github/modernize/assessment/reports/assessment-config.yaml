analysisCoverage: issue-only
security:
  minimumCveSeverity: high
  cveScanScope: direct
java:
  assessmentDomains:
    - java-upgrade
    - cloud-readiness
  targetRuntime: openjdk25
  targetComputeServices:
    - azure-aks
    - azure-appservice
    - azure-container-apps
  targetOS:
    - windows
    - linux
  enableContainerization: false
dotnet:
  assessmentDomains:
    - dotnet-upgrade
    - cloud-readiness
  targetRuntime: net10.0
  targetComputeServices:
    - Any
